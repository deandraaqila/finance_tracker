<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financer - Pencatatan Keuangan Modern</title>
  
  <!-- Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- SheetJS (xlsx) for Excel Export/Import -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }
  </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 antialiased selection:bg-brand-500 selection:text-white">

  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- UTILS & STORAGE SERVICE ---
    const STORAGE_KEY = 'FINANCER_APP_DATA_V1';

    const DEFAULT_CATEGORIES = {
      pemasukan: ['Gaji', 'Uang Saku', 'Bonus', 'Penjualan', 'Hadiah', 'Lainnya'],
      pengeluaran: ['Makanan', 'Transportasi', 'Belanja', 'Pendidikan', 'Tagihan', 'Hiburan', 'Kesehatan', 'Lainnya']
    };

    const INITIAL_TRANSACTIONS = [
      { id: 'tx-1', tanggal: '2026-09-28', jenis: 'pemasukan', kategori: 'Gaji', keterangan: 'Gaji Bulanan September', metode: 'Transfer', nominal: 7500000, waktuInput: '2026-09-28T09:00:00' },
      { id: 'tx-2', tanggal: '2026-09-29', jenis: 'pengeluaran', kategori: 'Makanan', keterangan: 'Makan siang & kopi', metode: 'E-wallet', nominal: 65000, waktuInput: '2026-09-29T12:30:00' },
      { id: 'tx-3', tanggal: '2026-09-29', jenis: 'pengeluaran', kategori: 'Belanja', keterangan: 'Belanja bulanan minimarket', metode: 'Debit', nominal: 345000, waktuInput: '2026-09-29T18:15:00' },
      { id: 'tx-4', tanggal: '2026-09-30', jenis: 'pengeluaran', kategori: 'Tagihan', keterangan: 'Tagihan Internet', metode: 'Transfer', nominal: 350000, waktuInput: '2026-09-30T08:00:00' },
      { id: 'tx-5', tanggal: '2026-09-30', jenis: 'pemasukan', kategori: 'Bonus', keterangan: 'Project Bonus UI Design', metode: 'Transfer', nominal: 1500000, waktuInput: '2026-09-30T10:00:00' }
    ];

    const StorageService = {
      get: () => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return { transactions: INITIAL_TRANSACTIONS, categories: DEFAULT_CATEGORIES, user: { name: 'Deandra Rahman', currency: 'Rp' } };
          return JSON.parse(raw);
        } catch (e) {
          console.error('Storage Read Error', e);
          return { transactions: INITIAL_TRANSACTIONS, categories: DEFAULT_CATEGORIES, user: { name: 'Deandra Rahman', currency: 'Rp' } };
        }
      },
      save: (data) => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
          console.error('Storage Save Error', e);
        }
      }
    };

    const formatRupiah = (number) => {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }).format(number).replace('Rp', 'Rp ');
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [appData, setAppData] = useState(() => StorageService.get());
      const [activeTab, setActiveTab] = useState('dashboard'); // dashboard | transaksi | laporan | pengaturan
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('FINANCER_DARK') === 'true');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingTransaction, setEditingTransaction] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [notification, setNotification] = useState(null);

      // Save on State Change
      useEffect(() => {
        StorageService.save(appData);
      }, [appData]);

      // Dark Mode Effect
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('FINANCER_DARK', 'true');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('FINANCER_DARK', 'false');
        }
      }, [darkMode]);

      // Re-initialize Lucide Icons on re-render
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const showToast = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 3000);
      };

      // CRUD Operations
      const handleSaveTransaction = (tx) => {
        if (editingTransaction) {
          setAppData(prev => ({
            ...prev,
            transactions: prev.transactions.map(t => t.id === tx.id ? tx : t)
          }));
          showToast('Transaksi berhasil diperbarui');
        } else {
          setAppData(prev => ({
            ...prev,
            transactions: [tx, ...prev.transactions]
          }));
          showToast('Transaksi baru berhasil ditambahkan');
        }
        setIsModalOpen(false);
        setEditingTransaction(null);
      };

      const handleDeleteTransaction = (id) => {
        if (window.confirm('Apakah Anda yakin ingin menghapus transaksi ini?')) {
          setAppData(prev => ({
            ...prev,
            transactions: prev.transactions.filter(t => t.id !== id)
          }));
          showToast('Transaksi berhasil dihapus', 'info');
        }
      };

      // Backup & Restore
      const handleExportBackup = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", `Financer_Backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(dlAnchor);
        dlAnchor.click();
        dlAnchor.remove();
        showToast('Backup JSON berhasil diunduh');
      };

      const handleImportBackup = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            if (parsed.transactions && Array.isArray(parsed.transactions)) {
              setAppData(parsed);
              showToast('Data berhasil dipulihkan!');
            } else {
              alert('Format file JSON backup tidak valid.');
            }
          } catch (err) {
            alert('Gagal membaca file JSON backup.');
          }
        };
        reader.readAsText(file);
      };

      // Export to Excel Multi-Sheet
      const handleExportExcel = () => {
        const { transactions } = appData;
        
        // Sheet 1: Transaksi
        const sheet1Data = transactions.map((t, idx) => ({
          'No': idx + 1,
          'ID Transaksi': t.id,
          'Tanggal': t.tanggal,
          'Jenis': t.jenis.toUpperCase(),
          'Kategori': t.kategori,
          'Keterangan': t.keterangan,
          'Metode Pembayaran': t.metode,
          'Nominal (Rp)': t.nominal,
          'Waktu Input': t.waktuInput
        }));

        // Summary calculations
        const totalPemasukan = transactions.filter(t => t.jenis === 'pemasukan').reduce((acc, curr) => acc + curr.nominal, 0);
        const totalPengeluaran = transactions.filter(t => t.jenis === 'pengeluaran').reduce((acc, curr) => acc + curr.nominal, 0);
        const saldo = totalPemasukan - totalPengeluaran;

        // Sheet 2: Ringkasan
        const sheet2Data = [
          { 'Metrik': 'Total Pemasukan', 'Nilai': totalPemasukan },
          { 'Metrik': 'Total Pengeluaran', 'Nilai': totalPengeluaran },
          { 'Metrik': 'Saldo Akhir', 'Nilai': saldo },
          { 'Metrik': 'Jumlah Transaksi', 'Nilai': transactions.length }
        ];

        // Sheet 3: Laporan Kategori
        const categoryReport = {};
        transactions.forEach(t => {
          if (!categoryReport[t.kategori]) {
            categoryReport[t.kategori] = { pemasukan: 0, pengeluaran: 0 };
          }
          if (t.jenis === 'pemasukan') categoryReport[t.kategori].pemasukan += t.nominal;
          else categoryReport[t.kategori].pengeluaran += t.nominal;
        });

        const sheet3Data = Object.keys(categoryReport).map(kat => ({
          'Kategori': kat,
          'Total Pemasukan (Rp)': categoryReport[kat].pemasukan,
          'Total Pengeluaran (Rp)': categoryReport[kat].pengeluaran
        }));

        const wb = XLSX.utils.book_new();
        const ws1 = XLSX.utils.json_to_sheet(sheet1Data);
        const ws2 = XLSX.utils.json_to_sheet(sheet2Data);
        const ws3 = XLSX.utils.json_to_sheet(sheet3Data);

        XLSX.utils.book_append_sheet(wb, ws1, 'Transaksi');
        XLSX.utils.book_append_sheet(wb, ws2, 'Ringkasan');
        XLSX.utils.book_append_sheet(wb, ws3, 'Laporan Kategori');

        const fileName = `Catatan_Keuangan_${new Date().toISOString().split('T')[0]}.xlsx`;
        XLSX.writeFile(wb, fileName);
        showToast('File Excel berhasil diexport!');
      };

      // Import Excel
      const handleImportExcel = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const bstr = evt.target.result;
            const wb = XLSX.read(bstr, { type: 'binary' });
            const wsName = wb.SheetNames[0];
            const ws = wb.Sheets[wsName];
            const data = XLSX.utils.sheet_to_json(ws);

            let successCount = 0;
            const newTxs = [];

            data.forEach((row) => {
              const tanggal = row['Tanggal'] || new Date().toISOString().split('T')[0];
              const jenis = (row['Jenis'] || 'pengeluaran').toString().toLowerCase();
              const kategori = row['Kategori'] || 'Lainnya';
              const keterangan = row['Keterangan'] || 'Imported';
              const metode = row['Metode Pembayaran'] || 'Cash';
              const nominal = Number(row['Nominal (Rp)'] || row['Nominal'] || 0);

              if (nominal > 0) {
                newTxs.push({
                  id: 'import-' + Math.random().toString(36).substr(2, 9),
                  tanggal,
                  jenis: jenis.includes('masuk') ? 'pemasukan' : 'pengeluaran',
                  kategori,
                  keterangan,
                  metode,
                  nominal,
                  waktuInput: new Date().toISOString()
                });
                successCount++;
              }
            });

            if (successCount > 0) {
              setAppData(prev => ({
                ...prev,
                transactions: [...newTxs, ...prev.transactions]
              }));
              showToast(`Berhasil mengimpor ${successCount} transaksi dari Excel!`);
            } else {
              alert('Tidak ada transaksi valid yang ditemukan dalam file Excel.');
            }
          } catch (err) {
            console.error(err);
            alert('Gagal membaca file Excel. Pastikan format kolom sesuai.');
          }
        };
        reader.readAsBinaryString(file);
      };

      const handleClearAllData = () => {
        if (window.confirm('PERINGATAN: Apakah Anda yakin ingin MENGHAPUS SELURUH DATA transaksi Anda? Tindakan ini tidak dapat dibatalkan.')) {
          setAppData(prev => ({ ...prev, transactions: [] }));
          showToast('Seluruh data transaksi telah dihapus', 'info');
        }
      };

      // Calculated Financial Stats
      const stats = useMemo(() => {
        const totalPemasukan = appData.transactions.filter(t => t.jenis === 'pemasukan').reduce((a, b) => a + b.nominal, 0);
        const totalPengeluaran = appData.transactions.filter(t => t.jenis === 'pengeluaran').reduce((a, b) => a + b.nominal, 0);
        const saldo = totalPemasukan - totalPengeluaran;
        return { totalPemasukan, totalPengeluaran, saldo, count: appData.transactions.length };
      }, [appData.transactions]);

      return (
        <div className="flex h-screen overflow-hidden">
          {/* Toast Notification */}
          {notification && (
            <div className={`fixed top-5 right-5 z-50 px-4 py-3 rounded-xl shadow-lg text-white font-medium text-sm flex items-center space-x-2 transition-all duration-300 ${notification.type === 'info' ? 'bg-amber-600' : 'bg-emerald-600'}`}>
              <i data-lucide={notification.type === 'info' ? 'alert-circle' : 'check-circle'} className="w-5 h-5"></i>
              <span>{notification.msg}</span>
            </div>
          )}

          {/* SIDEBAR (Desktop) */}
          <aside className="hidden md:flex md:w-64 flex-col bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700/60 p-5 justify-between transition-colors">
            <div>
              {/* Brand Header */}
              <div className="flex items-center space-x-3 mb-8 px-2">
                <div className="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-brand-500/20">
                  <i data-lucide="wallet" className="w-6 h-6"></i>
                </div>
                <div>
                  <h1 className="font-bold text-slate-900 dark:text-white text-lg tracking-tight">Financer</h1>
                  <p className="text-xs text-slate-500 dark:text-slate-400 font-medium">Smart Finance Tracker</p>
                </div>
              </div>

              {/* Navigation Menu */}
              <nav className="space-y-1.5">
                {[
                  { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                  { id: 'transaksi', label: 'Transaksi', icon: 'receipt' },
                  { id: 'laporan', label: 'Laporan', icon: 'bar-chart-3' },
                  { id: 'pengaturan', label: 'Pengaturan', icon: 'settings' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-semibold transition-all duration-200 ${
                      activeTab === item.id 
                        ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' 
                        : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/50 hover:text-slate-900 dark:hover:text-white'
                    }`}
                  >
                    <i data-lucide={item.icon} className="w-5 h-5"></i>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            {/* Dark Mode Toggle & User Info */}
            <div className="border-t border-slate-200 dark:border-slate-700/60 pt-4 space-y-3">
              <div className="flex items-center justify-between px-2 text-xs font-semibold text-slate-500 dark:text-slate-400">
                <span>Mode Gelap</span>
                <button
                  onClick={() => setDarkMode(!darkMode)}
                  className="w-11 h-6 rounded-full bg-slate-200 dark:bg-slate-700 relative p-0.5 transition-colors"
                >
                  <div className={`w-5 h-5 rounded-full bg-white dark:bg-brand-500 shadow-sm flex items-center justify-center transform transition-transform ${darkMode ? 'translate-x-5' : 'translate-x-0'}`}>
                    <i data-lucide={darkMode ? "moon" : "sun"} className="w-3 h-3 text-slate-700 dark:text-white"></i>
                  </div>
                </button>
              </div>

              <div className="flex items-center space-x-3 px-2 pt-2">
                <div className="w-9 h-9 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center font-bold text-slate-700 dark:text-slate-200">
                  {appData.user.name.charAt(0)}
                </div>
                <div className="overflow-hidden">
                  <p className="text-sm font-bold text-slate-800 dark:text-slate-100 truncate">{appData.user.name}</p>
                  <p className="text-xs text-slate-400 truncate">Siswa TKJ / Developer</p>
                </div>
              </div>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 flex flex-col h-full overflow-y-auto bg-slate-50 dark:bg-slate-900 transition-colors pb-20 md:pb-6">
            
            {/* Top Bar / Header */}
            <header className="sticky top-0 z-10 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 px-6 py-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <h2 className="text-2xl font-bold text-slate-900 dark:text-white capitalize tracking-tight">
                  {activeTab}
                </h2>
                <p className="text-xs text-slate-500 dark:text-slate-400 font-medium">
                  {new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
                </p>
              </div>

              {/* Action Buttons */}
              <div className="flex items-center space-x-3">
                <button
                  onClick={handleExportExcel}
                  className="flex items-center space-x-2 px-3.5 py-2.5 rounded-xl border border-emerald-300 dark:border-emerald-700/60 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 hover:bg-emerald-100 dark:hover:bg-emerald-900/50 text-xs font-semibold transition-all"
                  title="Export Data ke File Excel (.xlsx)"
                >
                  <i data-lucide="file-spreadsheet" className="w-4 h-4"></i>
                  <span className="hidden sm:inline">Export Excel</span>
                </button>

                <button
                  onClick={() => { setEditingTransaction(null); setIsModalOpen(true); }}
                  className="flex items-center space-x-2 px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold shadow-md shadow-brand-500/20 transition-all active:scale-95"
                >
                  <i data-lucide="plus" className="w-4 h-4"></i>
                  <span>Tambah Transaksi</span>
                </button>
              </div>
            </header>

            {/* TAB CONTENTS */}
            <div className="p-6 max-w-7xl w-full mx-auto space-y-6">
              {activeTab === 'dashboard' && (
                <DashboardView 
                  stats={stats} 
                  transactions={appData.transactions} 
                  onEdit={(tx) => { setEditingTransaction(tx); setIsModalOpen(true); }}
                  onDelete={handleDeleteTransaction}
                  onViewAll={() => setActiveTab('transaksi')}
                />
              )}

              {activeTab === 'transaksi' && (
                <TransactionsView 
                  transactions={appData.transactions}
                  categories={appData.categories}
                  onEdit={(tx) => { setEditingTransaction(tx); setIsModalOpen(true); }}
                  onDelete={handleDeleteTransaction}
                />
              )}

              {activeTab === 'laporan' && (
                <ReportsView transactions={appData.transactions} />
              )}

              {activeTab === 'pengaturan' && (
                <SettingsView 
                  appData={appData}
                  setAppData={setAppData}
                  onExportBackup={handleExportBackup}
                  onImportBackup={handleImportBackup}
                  onImportExcel={handleImportExcel}
                  onClearData={handleClearAllData}
                />
              )}
            </div>
          </main>

          {/* BOTTOM NAVIGATION (Mobile) */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700/60 px-4 py-2 flex justify-around z-20 shadow-lg">
            {[
              { id: 'dashboard', label: 'Home', icon: 'layout-dashboard' },
              { id: 'transaksi', label: 'Transaksi', icon: 'receipt' },
              { id: 'laporan', label: 'Laporan', icon: 'bar-chart-3' },
              { id: 'pengaturan', label: 'Pengaturan', icon: 'settings' }
            ].map(item => (
              <button
                key={item.id}
                onClick={() => setActiveTab(item.id)}
                className={`flex flex-col items-center py-1 px-3 rounded-lg text-xs font-semibold ${
                  activeTab === item.id ? 'text-brand-600 dark:text-brand-400' : 'text-slate-500 dark:text-slate-400'
                }`}
              >
                <i data-lucide={item.icon} className="w-5 h-5 mb-0.5"></i>
                <span>{item.label}</span>
              </button>
            ))}
          </nav>

          {/* TRANSACTION MODAL */}
          {isModalOpen && (
            <TransactionModal 
              isOpen={isModalOpen}
              onClose={() => { setIsModalOpen(false); setEditingTransaction(null); }}
              onSave={handleSaveTransaction}
              editingTransaction={editingTransaction}
              categories={appData.categories}
            />
          )}
        </div>
      );
    }

    // --- VIEW 1: DASHBOARD VIEW ---
    function DashboardView({ stats, transactions, onEdit, onDelete, onViewAll }) {
      return (
        <div className="space-y-6">
          {/* STATS CARDS */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            {/* Saldo Card */}
            <div className="bg-gradient-to-br from-brand-600 to-brand-700 text-white rounded-2xl p-5 shadow-lg shadow-brand-500/15 relative overflow-hidden flex flex-col justify-between">
              <div className="absolute right-[-10px] top-[-10px] w-24 h-24 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
              <div>
                <div className="flex items-center justify-between mb-3">
                  <span className="text-xs font-semibold uppercase tracking-wider text-brand-100">Total Saldo</span>
                  <div className="p-2 bg-white/10 rounded-xl backdrop-blur-sm">
                    <i data-lucide="wallet" className="w-5 h-5 text-white"></i>
                  </div>
                </div>
                <h3 className="text-2xl font-extrabold tracking-tight mb-1">{formatRupiah(stats.saldo)}</h3>
              </div>
              <p className="text-xs text-brand-100/80 mt-4 flex items-center space-x-1">
                <i data-lucide="shield-check" className="w-3.5 h-3.5"></i>
                <span>Kondisi Keuangan Terupdate</span>
              </p>
            </div>

            {/* Pemasukan Card */}
            <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200/80 dark:border-slate-700/60 shadow-sm flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between mb-3">
                  <span className="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Pemasukan</span>
                  <div className="p-2 bg-emerald-50 dark:bg-emerald-950/50 rounded-xl text-emerald-600 dark:text-emerald-400">

    // --- CHART COMPONENTS (Chart.js Wrapper) ---
    function CashFlowChart({ transactions }) {
      const canvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;

        // Group by Date
        const sorted = [...transactions].sort((a, b) => new Date(a.tanggal) - new Date(b.tanggal));
        const dateMap = {};
        sorted.forEach(t => {
          if (!dateMap[t.tanggal]) dateMap[t.tanggal] = { masukan: 0, keluaran: 0 };
          if (t.jenis === 'pemasukan') dateMap[t.tanggal].masukan += t.nominal;
          else dateMap[t.tanggal].keluaran += t.nominal;
        });

        const labels = Object.keys(dateMap);
        const dataMasukan = labels.map(l => dateMap[l].masukan);
        const dataKeluaran = labels.map(l => dateMap[l].keluaran);

        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
        }

        const ctx = canvasRef.current.getContext('2d');
        chartInstanceRef.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels.length > 0 ? labels : ['Hari ini'],
            datasets: [
              {
                label: 'Pemasukan',
                data: dataMasukan.length > 0 ? dataMasukan : [0],
                borderColor: '#10b981',
                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                tension: 0.3,
                fill: true
              },
              {
                label: 'Pengeluaran',
                data: dataKeluaran.length > 0 ? dataKeluaran : [0],
                borderColor: '#f43f5e',
                backgroundColor: 'rgba(244, 63, 94, 0.1)',
                tension: 0.3,
                fill: true
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'top', labels: { font: { family: 'Plus Jakarta Sans' } } }
            },
            scales: {
              y: { ticks: { callback: value => 'Rp' + (value/1000) + 'k' } }
            }
          }
        });

        return () => {
          if (chartInstanceRef.current) chartInstanceRef.current.destroy();
        };
      }, [transactions]);

      return <canvas ref={canvasRef}></canvas>;
    }

    function ExpenseCategoryChart({ transactions }) {
      const canvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;

        const expenses = transactions.filter(t => t.jenis === 'pengeluaran');
        const catMap = {};
        expenses.forEach(t => {
          catMap[t.kategori] = (catMap[t.kategori] || 0) + t.nominal;
        });

        const labels = Object.keys(catMap);
        const data = Object.values(catMap);

        if (chartInstanceRef.current) chartInstanceRef.current.destroy();

        const ctx = canvasRef.current.getContext('2d');
        chartInstanceRef.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: labels.length > 0 ? labels : ['Belum ada data'],
            datasets: [{
              data: data.length > 0 ? data : [1],
              backgroundColor: ['#0284c7', '#10b981', '#f59e0b', '#f43f5e', '#8b5cf6', '#ec4899', '#64748b']
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom', labels: { font: { family: 'Plus Jakarta Sans', size: 10 } } }
            }
          }
        });

        return () => {
          if (chartInstanceRef.current) chartInstanceRef.current.destroy();
        };
      }, [transactions]);

      return <canvas ref={canvasRef}></canvas>;
    }

      const [sortBy, setSortBy] = useState('tanggal-desc');

      const filteredTransactions = useMemo(() => {
        return transactions.filter(t => {
          const matchSearch = t.keterangan.toLowerCase().includes(search.toLowerCase()) || t.kategori.toLowerCase().includes(search.toLowerCase());
          const matchJenis = filterJenis === 'semua' || t.jenis === filterJenis;
          const matchKategori = filterKategori === 'semua' || t.kategori === filterKategori;
          const matchMetode = filterMetode === 'semua' || t.metode === filterMetode;
          return matchSearch && matchJenis && matchKategori && matchMetode;
        }).sort((a, b) => {
          if (sortBy === 'tanggal-desc') return new Date(b.tanggal) - new Date(a.tanggal);
          if (sortBy === 'tanggal-asc') return new Date(a.tanggal) - new Date(b.tanggal);
          if (sortBy === 'nominal-desc') return b.nominal - a.nominal;
          if (sortBy === 'nominal-asc') return a.nominal - b.nominal;
          return 0;
        });
      }, [transactions, search, filterJenis, filterKategori, filterMetode, sortBy]);

      const allCategories = [...categories.pemasukan, ...categories.pengeluaran];

                />

              {/* Filter Jenis */}

                value={filterJenis}

                className="w-full py-2 px-3 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl text-xs dark:text-white focus:outline-none"
              >
                <option value="semua">Semua Jenis</option>
                <option value="pemasukan">Pemasukan</option>
                <option value="pengeluaran">Pengeluaran</option>
              </select>

              {/* Filter Kategori */}
              <select
                value={filterKategori}
                onChange={(e) => setFilterKategori(e.target.value)}
                className="w-full py-2 px-3 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl text-xs dark:text-white focus:outline-none"
              >
                <option value="semua">Semua Kategori</option>
                {allCategories.map((c, i) => <option key={i} value={c}>{c}</option>)}
              </select>

              {/* Filter Metode */}
              <select
                value={filterMetode}
                onChange={(e) => setFilterMetode(e.target.value)}
                className="w-full py-2 px-3 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl text-xs dark:text-white focus:outline-none"
              >
                <option value="semua">Semua Metode</option>
                <option value="Cash">Cash</option>
                <option value="Transfer">Transfer</option>
                <option value="E-wallet">E-wallet</option>
                <option value="Debit">Debit</option>

              {/* Sort By */}
              <select

              >

                <option value="tanggal-asc">Tanggal Terlama</option>
                <option value="nominal-desc">Nominal Terbesar</option>

            <div className="p-4 border-b border-slate-100 dark:border-slate-700/60 flex items-center justify-between text-xs text-slate-500">
              <span>Menampilkan {filteredTransactions.length} dari {transactions.length} transaksi</span>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-50 dark:bg-slate-700/40 text-slate-500 dark:text-slate-400 font-semibold uppercase tracking-wider">
                  <tr>
                    <th className="p-4">Tanggal</th>
                    <th className="p-4">Jenis</th>
                    <th className="p-4">Kategori</th>
                    <th className="p-4">Keterangan</th>
                    <th className="p-4">Metode</th>
                    <th className="p-4">Nominal</th>
                    <th className="p-4 text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 dark:divide-slate-700/50 text-slate-700 dark:text-slate-300">
                  {filteredTransactions.map(tx => (

                        <div className="flex items-center justify-center space-x-1">

                            <i data-lucide="pencil" className="w-3.5 h-3.5"></i>
                          </button>
                          <button onClick={() => onDelete(tx.id)} className="p-1.5 hover:bg-rose-100 dark:hover:bg-rose-950 rounded-lg text-rose-600 dark:text-rose-400">
                            <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>

                    <tr>
                      <td colSpan="7" className="p-8 text-center text-slate-400">Tidak ada transaksi yang cocok dengan filter.</td>

    // --- VIEW 3: REPORTS VIEW ---
    function ReportsView({ transactions }) {
      const [timeRange, setTimeRange] = useState('semua');

      const filtered = useMemo(() => {
        if (timeRange === 'semua') return transactions;
        const now = new Date();
        return transactions.filter(t => {
          const tDate = new Date(t.tanggal);
          if (timeRange === 'bulan-ini') {
            return tDate.getMonth() === now.getMonth() && tDate.getFullYear() === now.getFullYear();
          }
          if (timeRange === 'tahun-ini') {
            return tDate.getFullYear() === now.getFullYear();
          }
          return true;
        });
      }, [transactions, timeRange]);

      const masukan = filtered.filter(t => t.jenis === 'pemasukan').reduce((a, b) => a + b.nominal, 0);
      const keluaran = filtered.filter(t => t.jenis === 'pengeluaran').reduce((a, b) => a + b.nominal, 0);
      const selisih = masukan - keluaran;

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 shadow-sm">
            <span className="text-sm font-bold text-slate-800 dark:text-white">Periode Laporan</span>
            <div className="flex space-x-2">
              {[
                { id: 'semua', label: 'Semua Waktu' },
                { id: 'bulan-ini', label: 'Bulan Ini' },
                { id: 'tahun-ini', label: 'Tahun Ini' }
              ].map(btn => (
                <button
                  key={btn.id}
                  onClick={() => setTimeRange(btn.id)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition-all ${timeRange === btn.id ? 'bg-brand-600 text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}`}
                >
                  {btn.label}
                </button>
              ))}
            </div>
          </div>

          {/* SUMMARY GRID */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 shadow-sm">
              <span className="text-xs text-slate-400 font-semibold uppercase">Total Pemasukan</span>
              <h3 className="text-xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-1">{formatRupiah(masukan)}</h3>
            </div>
            <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 shadow-sm">
              <span className="text-xs text-slate-400 font-semibold uppercase">Total Pengeluaran</span>
              <h3 className="text-xl font-extrabold text-rose-600 dark:text-rose-400 mt-1">{formatRupiah(keluaran)}</h3>
            </div>
            <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 shadow-sm">
              <span className="text-xs text-slate-400 font-semibold uppercase">Bersih (Net)</span>
              <h3 className={`text-xl font-extrabold mt-1 ${selisih >= 0 ? 'text-brand-600 dark:text-brand-400' : 'text-rose-600'}`}>{formatRupiah(selisih)}</h3>
            </div>
          </div>
        </div>
      );
    }

                  value={userName}
                  onChange={(e) => setUserName(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-200 dark:border-slate-600 rounded-xl bg-slate-50 dark:bg-slate-700/50 text-sm dark:text-white focus:outline-none focus:border-brand-500"
                />
              </div>
              <button type="submit" className="px-4 py-2 bg-brand-600 text-white rounded-xl text-xs font-semibold hover:bg-brand-700 transition-colors">
                Simpan Perubahan
              </button>
            </form>
          </div>

          {/* DATA MANAGEMENT */}
          <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 shadow-sm space-y-4">
            <h4 className="font-bold text-slate-900 dark:text-white text-base">Kelola Data & Integrasi Excel</h4>
            
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
              {/* Backup */}
              <button onClick={onExportBackup} className="flex items-center space-x-3 p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/40 text-left transition-colors">
                <i data-lucide="download" className="w-5 h-5 text-brand-600"></i>
                <div>
                  <p className="text-xs font-bold text-slate-800 dark:text-slate-200">Backup Data (JSON)</p>
                  <p className="text-[11px] text-slate-400">Download seluruh data</p>
                </div>
              </button>

              {/* Restore JSON */}
              <label className="flex items-center space-x-3 p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/40 text-left cursor-pointer transition-colors">
                <i data-lucide="upload" className="w-5 h-5 text-brand-600"></i>
                <div>
                  <p className="text-xs font-bold text-slate-800 dark:text-slate-200">Restore Data (JSON)</p>
                  <p className="text-[11px] text-slate-400">Pulihkan dari file JSON</p>
                </div>
                <input type="file" accept=".json" onChange={onImportBackup} className="hidden" />
              </label>

              {/* Import Excel */}
              <label className="flex items-center space-x-3 p-3 rounded-xl border border-emerald-200 dark:border-emerald-800/60 bg-emerald-50/50 dark:bg-emerald-950/20 hover:bg-emerald-100/50 text-left cursor-pointer transition-colors">
                <i data-lucide="file-spreadsheet" className="w-5 h-5 text-emerald-600"></i>
                <div>
                  <p className="text-xs font-bold text-emerald-800 dark:text-emerald-300">Import File Excel</p>
                  <p className="text-[11px] text-emerald-600 dark:text-emerald-400">Tambahkan dari .xlsx</p>
                </div>
                <input type="file" accept=".xlsx, .xls" onChange={onImportExcel} className="hidden" />
              </label>

              {/* Clear Data */}
              <button onClick={onClearData} className="flex items-center space-x-3 p-3 rounded-xl border border-rose-200 dark:border-rose-900/60 bg-rose-50/50 dark:bg-rose-950/20 hover:bg-rose-100/50 text-left transition-colors">
                <i data-lucide="trash-2" className="w-5 h-5 text-rose-600"></i>
                <div>
                  <p className="text-xs font-bold text-rose-800 dark:text-rose-300">Hapus Semua Data</p>
                  <p className="text-[11px] text-rose-500">Reset aplikasi dari awal</p>
                </div>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- MODAL: ADD / EDIT TRANSACTION ---
    function TransactionModal({ isOpen, onClose, onSave, editingTransaction, categories }) {
      const [jenis, setJenis] = useState(editingTransaction ? editingTransaction.jenis : 'pengeluaran');
      const [nominal, setNominal] = useState(editingTransaction ? editingTransaction.nominal : '');
      const [kategori, setKategori] = useState(editingTransaction ? editingTransaction.kategori : categories.pengeluaran[0]);
      const [tanggal, setTanggal] = useState(editingTransaction ? editingTransaction.tanggal : new Date().toISOString().split('T')[0]);
      const [keterangan, setKeterangan] = useState(editingTransaction ? editingTransaction.keterangan : '');
      const [metode, setMetode] = useState(editingTransaction ? editingTransaction.metode : 'Cash');

      useEffect(() => {
        // Auto update default category if type changes
        if (!editingTransaction) {
          setKategori(jenis === 'pemasukan' ? categories.pemasukan[0] : categories.pengeluaran[0]);
        }
      }, [jenis]);

      const handleSubmit = (e) => {
        e.preventDefault();
        const numVal = Number(nominal);
        if (!numVal || numVal <= 0) {
          alert('Nominal harus berupa angka lebih besar dari 0');
          return;
        }
        if (!keterangan.trim()) {
          alert('Keterangan wajib diisi');
          return;
        }

        onSave({
          id: editingTransaction ? editingTransaction.id : 'tx-' + Date.now(),
          tanggal,
          jenis,
          kategori,
          keterangan,
          metode,
          nominal: numVal,
          waktuInput: editingTransaction ? editingTransaction.waktuInput : new Date().toISOString()
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
          <div className="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 dark:border-slate-700/80 space-y-5 animate-in fade-in zoom-in-95 duration-200">
            
            <div className="flex items-center justify-between border-b border-slate-100 dark:border-slate-700 pb-3">
              <h3 className="text-lg font-bold text-slate-900 dark:text-white">
                {editingTransaction ? 'Edit Transaksi' : 'Tambah Transaksi Baru'}
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              {/* Type Switcher */}
              <div className="grid grid-cols-2 gap-2 p-1 bg-slate-100 dark:bg-slate-700/50 rounded-xl">
                <button
                  type="button"
                  onClick={() => setJenis('pemasukan')}
                  className={`py-2 text-xs font-bold rounded-lg transition-all ${jenis === 'pemasukan' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300'}`}
                >
                  Pemasukan
                </button>
                <button
                  type="button"
                  onClick={() => setJenis('pengeluaran')}
                  className={`py-2 text-xs font-bold rounded-lg transition-all ${jenis === 'pengeluaran' ? 'bg-rose-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300'}`}
                >
                  Pengeluaran
                </button>
              </div>

              {/* Nominal */}
              <div>
                <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Nominal (Rp)</label>
                <input
                  type="number"
                  placeholder="Contoh: 50000"
                  value={nominal}
                  onChange={(e) => setNominal(e.target.value)}
                  className="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-600 rounded-xl bg-slate-50 dark:bg-slate-700/50 text-base font-bold dark:text-white focus:outline-none focus:border-brand-500"
                  required
                />
              </div>

              {/* Kategori & Metode */}
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Kategori</label>
                  <select
                    value={kategori}
                    onChange={(e) => setKategori(e.target.value)}
                    className="w-full px-3 py-2 border border-slate-200 dark:border-slate-600 rounded-xl bg-slate-50 dark:bg-slate-700/50 text-xs dark:text-white focus:outline-none"
                  >
                    {(jenis === 'pemasukan' ? categories.pemasukan : categories.pengeluaran).map((c, i) => (
                      <option key={i} value={c}>{c}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Metode Pembayaran</label>
                  <select
                    value={metode}
                    onChange={(e) => setMetode(e.target.value)}
                    className="w-full px-3 py-2 border border-slate-200 dark:border-slate-600 rounded-xl bg-slate-50 dark:bg-slate-700/50 text-xs dark:text-white focus:outline-none"
                  >
                    <option value="Cash">Cash</option>
                    <option value="Transfer">Transfer</option>
                    <option value="E-wallet">E-wallet</option>
                    <option value="Debit">Debit</option>
                  </select>
                </div>
              </div>

              {/* Tanggal */}
              <div>
                <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Tanggal</label>
                <input
                  type="date"
                  value={tanggal}
                  onChange={(e) => setTanggal(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-200 dark:border-slate-600 rounded-xl bg-slate-50 dark:bg-slate-700/50 text-xs dark:text-white focus:outline-none"
                  required
                />
              </div>

              {/* Keterangan */}
              <div>
                <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Keterangan / Catatan</label>
                <input
                  type="text"
                  placeholder="Contoh: Makan siang Nasi Padang"
                  value={keterangan}
                  onChange={(e) => setKeterangan(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-200 dark:border-slate-600 rounded-xl bg-slate-50 dark:bg-slate-700/50 text-xs dark:text-white focus:outline-none"
                  required
                />
              </div>

              {/* Buttons */}
              <div className="flex items-center justify-end space-x-2 pt-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-600 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  className="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold shadow-md shadow-brand-500/20"
                >
                  Simpan Transaksi
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Render Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
